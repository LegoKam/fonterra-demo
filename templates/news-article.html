<!DOCTYPE html>
<html>
  <head>
    <title>{{title}}</title>
    <meta name="description" content="{{summary.plaintext}}">
  </head>
  <body>
    <header></header>
    <main>
      <div>
        <div class="news-article">
          <div>
            <div>Title</div>
            <div><h1>{{title}}</h1></div>
          </div>
          <div>
            <div>Summary</div>
            <div>{{{summary.html}}}</div>
          </div>
          <div>
            <div>Read Time</div>
            <div>{{readTime}}</div>
          </div>
          <div>
            <div>Publish Date</div>
            <div>{{publishDate}}</div>
          </div>
          <div>
            <div>Slug</div>
            <div>{{slug}}</div>
          </div>
          {{#heroImage}}
          <div>
            <div>Hero</div>
            <div>
              <p>
                <picture>
                  <img src="{{_publishUrl}}" alt="{{title}}">
                </picture>
              </p>
            </div>
          </div>
          {{/heroImage}}
          <div>
            <div>Body</div>
            <div>{{{body.html}}}</div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
